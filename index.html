<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Imports</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="logo">PREMIUM IMPORTS</div>
</div>

<!-- MAIN GRID (EXACT 2x2) -->
<div class="grid">

  <div class="box a" onclick="openBox('imports')">
    <h2>Premium Imports</h2>
  </div>

  <div class="box b" onclick="openBox('auction')">
    <h2>Auction Imports</h2>
  </div>

  <div class="box c" onclick="openBox('showroom')">
    <h2>Weekly Showrooms</h2>
  </div>

  <div class="box d" onclick="openBox('inquiry')">
    <h2>Inquiry & Import</h2>
  </div>

</div>

<!-- MODAL VIEW -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button onclick="closeBox()" class="close">X</button>
    <div id="content"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
